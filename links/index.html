*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
main{min-height:100vh;display:flex;justify-content:center;padding:48px 16px}
.card{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center}
.photo{width:112px;height:112px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
h1{margin:18px 0 4px;font-size:26px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0;font-size:15px;color:var(--muted);line-height:1.5}
.status{margin-top:14px;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);background:var(--card)}
.dot{width:8px;height:8px;border-radius:50%;background:#16a34a}
nav{width:100%;margin-top:28px;display:flex;flex-direction:column;gap:12px}
nav a{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px;font-weight:600;text-decoration:none;transition:background .15s,border-color .15s}
nav a:hover{background:var(--hover);border-color:var(--accent)}
nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav a.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav a.primary:hover{opacity:.92}
svg{width:18px;height:18px;flex:none}
footer{margin-top:32px;font-size:12px;color:var(--muted)}
</style>
